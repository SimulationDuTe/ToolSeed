[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolseed"
version = "0.3.0"
description = "ToolSeed P0: store, retrieve and deliver reusable agent procedures"
requires-python = ">=3.11"

[project.scripts]
toolseed = "toolseed.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools]
packages = ["toolseed", "toolseed.core", "toolseed.adapters"]

[tool.setuptools.package-data]
toolseed = ["skill/*.md"]
