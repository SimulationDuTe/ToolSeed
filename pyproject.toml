[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolseed"
version = "0.4.1"
description = "ToolSeed: reusable agent procedures with a local MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
toolseed = "toolseed.cli:main"
toolseed-mcp = "toolseed.mcp_server:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools]
packages = ["toolseed", "toolseed.core", "toolseed.adapters"]

[tool.setuptools.package-data]
toolseed = ["skill/*.md"]
